name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - public-source-release

jobs:
  build-and-syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev

      - name: Build frontend
        run: npm run build

      - name: Test frontend module isolation
        run: npm run test:unit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend Python
        run: python -m compileall -q backend/app backend/alembic

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q
